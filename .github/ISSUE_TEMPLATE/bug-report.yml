name: Bug in a script
description: A bundled script (slop-scan, ssr-audit, video-prep, a Playwright check) misbehaves.
title: "Bug: "
labels: ["bug"]
body:
  - type: input
    id: script
    attributes:
      label: Script
      placeholder: e.g. skills/site-upgrade/scripts/slop-scan.mjs
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Node version, OS, shell (bash/zsh), framework
